<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Gallery | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Nova Gallery</h1>
            <p>CodeAlpha Frontend Development Internship — Task 1</p>
        </div>
    </header>

    <main class="container">

        <!-- Filter Buttons -->
        <section class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="travel">Travel</button>
            <button class="filter-btn" data-filter="city">City</button>
        </section>

        <!-- Gallery -->
        <section class="gallery" id="gallery">

            <!-- Nature -->
            <div class="gallery-item nature">
                <img src="images/nature1.jpg"
                     alt="Nature Image 1"
                     onclick="openLightbox(0)">
            </div>

            <div class="gallery-item nature">
                <img src="images/nature2.jpg"
                     alt="Nature Image 2"
                     onclick="openLightbox(1)">
            </div>

            <!-- Travel -->
            <div class="gallery-item travel">
                <img src="images/travel1.jpg"
                     alt="Travel Image 1"
                     onclick="openLightbox(2)">
            </div>

            <div class="gallery-item travel">
                <img src="images/travel2.jpg"
                     alt="Travel Image 2"
                     onclick="openLightbox(3)">
            </div>

            <!-- City -->
            <div class="gallery-item city">
                <img src="images/city1.jpg"
                     alt="City Image 1"
                     onclick="openLightbox(4)">
            </div>

            <div class="gallery-item city">
                <img src="images/city2.jpg"
                     alt="City Image 2"
                     onclick="openLightbox(5)">
            </div>

        </section>

    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <button class="close" onclick="closeLightbox()">
            &times;
        </button>

        <button class="prev" onclick="previousImage()">
            &#10094;
        </button>

        <img id="lightbox-img" src="" alt="Preview">

        <button class="next" onclick="nextImage()">
            &#10095;
        </button>

    </div>

    <footer>
        <p>
            © <span id="year"></span> Tarun Kumar Savu
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
